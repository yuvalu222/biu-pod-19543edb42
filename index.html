<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="פודקאסטים">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>הפודקאסטים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Light audio app, warm paper background. Header greeting + search; home = continue card, quiz prep, course "albums" rail, recent lessons;
   course page = colored hero with progress + numbered tracklist; floating mini-player above a 3-tab bar; full-screen now-playing sheet. */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFECE4; --fg:#1B1B22; --muted:#6B6B78; --faint:#9A9AA6; --line:#E6E2D8;
  --accent:#2F5BFF; --accent-2:#E8EDFF; --good:#11875D; --good-2:#E1F4EB; --warn:#B4530A; --warn-2:#FDEFD9;
  --shadow:0 1px 2px rgba(27,27,34,.05),0 6px 20px rgba(27,27,34,.06); --shadow-lg:0 16px 44px rgba(27,27,34,.18);
  --font:"Rubik","Heebo","Segoe UI",system-ui,sans-serif; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font)}
body{padding-bottom:calc(158px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button{transition:transform .14s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:rgba(246,244,239,.9);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);padding-top:env(safe-area-inset-top)}
header .wrap{padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hi{font-size:.86rem;color:var(--muted);font-weight:500}
h1{margin:0;font-size:1.65rem;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.off{font-size:.76rem;font-weight:600;color:var(--warn);background:var(--warn-2);padding:5px 10px;border-radius:999px;display:none;white-space:nowrap}
body.offline .off{display:inline-block}
.search{position:relative}
.search input{width:100%;min-height:48px;border-radius:14px;border:1.5px solid transparent;background:var(--surface);color:var(--fg);font:inherit;padding:0 46px 0 40px;box-shadow:var(--shadow);-webkit-appearance:none;appearance:none}
.search input:focus{outline:none;border-color:var(--accent)}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--faint);pointer-events:none}
.search .clr{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;color:var(--faint)}
.search .clr svg{width:18px;height:18px}
main{padding-block:4px 24px}
h2{font-size:1.18rem;font-weight:700;letter-spacing:-.01em;margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2 .lnk{font-size:.86rem;font-weight:600;color:var(--accent);min-height:44px;display:inline-flex;align-items:center}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:2px 14px}
/* covers */
.cover{width:100%;aspect-ratio:1;border-radius:18px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-shadow:0 8px 22px rgba(27,27,34,.14);isolation:isolate}
.cover svg.pat{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.cover .nm{font-weight:700;font-size:1.02rem;line-height:1.18;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.12)}
.cover .lb{position:absolute;top:10px;inset-inline-start:10px;font-weight:600;font-size:.7rem;background:rgba(255,255,255,.28);padding:3px 9px;border-radius:999px}
.cover.sm{border-radius:12px;padding:0;box-shadow:none}
.cover.sm .nm,.cover.sm .lb{display:none}
.row-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 12px;margin-inline:-18px;scrollbar-width:none;scroll-padding-inline:18px}
.row-scroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:146px;scroll-snap-align:start;text-align:start;display:block}
.tile b{display:block;font-weight:600;font-size:.9rem;line-height:1.3;margin-top:9px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .sub{font-size:.78rem;color:var(--muted);margin-top:1px}
.mbar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--good);border-radius:inherit}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid .tile{width:auto}
/* continue card */
.resume{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px;margin-top:14px;width:100%;text-align:start}
.resume .cover{width:72px;flex:none;border-radius:14px}
.resume .tx{flex:1;min-width:0}
.resume .k{font-size:.74rem;font-weight:700;color:var(--accent);letter-spacing:.01em}
.resume b{display:block;font-weight:600;font-size:.98rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.resume .s{font-size:.8rem;color:var(--muted)}
.resume .go{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(47,91,255,.35)}
.resume .go svg{width:24px;height:24px}
/* episode rows */
.ep{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.card .ep:last-child{border-bottom:0}
.ep .tx{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:start;padding:2px 0}
.ep .num{flex:none;width:28px;display:grid;place-items:center;font-weight:600;font-size:.92rem;color:var(--faint);font-variant-numeric:tabular-nums}
.ep .th{flex:none;width:52px;height:52px;position:relative}
.ep .th .cover{width:52px;height:52px}
.ep .ov{position:absolute;inset:0;border-radius:12px;background:rgba(27,27,34,.38);display:grid;place-items:center}
.ep .ov .eq i{background:#fff}
.ep svg{width:22px;height:22px}
.ep .t{flex:1;min-width:0;display:block}
.ep .t b{display:block;font-weight:600;font-size:.95rem;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep.on .t b{color:var(--accent)}
.ep .crs{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ep .spn{flex-basis:100%}
.ep .tag+.spn,.ep .tag~.spn{flex-basis:auto}
.ep .meta{font-size:.78rem;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.quiz{background:var(--warn-2);color:var(--warn)}
.tag.summary{background:var(--accent-2);color:var(--accent)}
.tag.ok{background:var(--good-2);color:var(--good)}
.prog{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden;max-width:240px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-inline-end:4px;vertical-align:-1px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.paused .eq i{animation-play-state:paused}
.dl{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--faint);position:relative}
.dl.done{color:var(--good)}
.dl .ring{position:absolute;inset:9px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0)}
.dl .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.dl .pct{position:relative;font-size:.6rem;font-weight:700;color:var(--accent)}
/* course hero */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);min-height:44px;font-weight:500;margin-top:4px}
.back svg{width:20px;height:20px}
.hero{border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;margin:6px 0 16px;box-shadow:0 14px 36px rgba(27,27,34,.16);isolation:isolate}
.hero svg.pat{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(0,0,0,.18),rgba(0,0,0,.04) 55%,rgba(0,0,0,.22))}
.hero .k{font-size:.78rem;font-weight:600;opacity:.9}
.hero h2{margin:4px 0 2px;font-size:1.55rem;line-height:1.2;color:#fff;display:block;font-weight:800;text-wrap:balance}
.hero .st{font-size:.88rem;opacity:.95}
.hero .hb{height:6px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden;margin-top:12px}
.hero .hb i{display:block;height:100%;background:#fff;border-radius:inherit}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill{min-height:46px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.24);color:#fff;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px}
.pill.primary{background:#fff;color:var(--fg);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.pill svg{width:18px;height:18px}
.empty{color:var(--muted);text-align:center;padding:34px 18px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin:0}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}
.stat{display:flex;gap:10px;margin-top:14px}
.stat div{flex:1;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
/* install hint */
.install{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px dashed #C9D3FF;border-radius:18px;padding:12px 8px 12px 14px;margin-top:14px}
.install .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center}
.install .ic svg{width:22px;height:22px}
.install p{margin:0;font-size:.86rem;line-height:1.4;flex:1}
.install p b{display:block;font-size:.92rem}
.install .ok{min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:.86rem;flex:none}
.install .x{flex:none;width:40px;height:40px;display:grid;place-items:center;color:var(--faint)}
.install .x svg{width:18px;height:18px}
.reqcard{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;margin-top:14px;color:var(--fg);text-decoration:none}
.reqcard .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--warn-2);color:var(--warn);display:grid;place-items:center}
.reqcard .ic svg{width:22px;height:22px}
.reqcard .tx{flex:1;min-width:0}
.reqcard b{display:block;font-size:.95rem}
.reqcard .tx span{font-size:.82rem;color:var(--muted)}
.reqcard .ar{flex:none;color:var(--faint);transform:scaleX(-1)}
.reqcard .ar svg{width:20px;height:20px}
a.pill{text-decoration:none}
.topics{margin-top:16px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:4px 14px}
.topics summary{min-height:48px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;cursor:pointer;list-style:none}
.topics summary::-webkit-details-marker{display:none}
.topics summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.topics[open] summary::after{transform:rotate(-135deg)}
.topics .ver{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--good-2);color:var(--good)}
.topics .unv{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.topics ol{margin:0 0 12px;padding-inline-start:22px;font-size:.88rem;line-height:1.45;color:var(--fg);max-height:40vh;overflow:auto}
.topics li{padding:3px 0}
.topics li.miss{color:var(--warn)}
.topics .mis{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-2);color:var(--warn)}
/* mini player */
.mini{position:fixed;inset-inline:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:8;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);display:none;overflow:hidden;max-width:700px;margin-inline:auto}
body.has-cur .mini{display:block;animation:up .28s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.mini .in{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px}
.mini .open{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mini .cv{width:46px;height:46px;flex:none}
.mini .cv .cover{width:46px;height:46px}
.mini .tx{flex:1;min-width:0;text-align:start}
.mini .tx b{display:block;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tx span{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mini .sk{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini .sk svg{width:24px;height:24px}
.mini .pp{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.mini .pp svg{width:22px;height:22px}
.mini .bar{height:3px;background:var(--surface-2)}
.mini .bar i{display:block;height:100%;background:var(--accent);width:0}
/* bottom nav */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:7;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;justify-content:space-around}
nav.tabs button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:500;color:var(--faint);position:relative}
nav.tabs button[aria-current=page]{color:var(--fg);font-weight:600}
nav.tabs button[aria-current=page] .dot{background:var(--accent);color:#fff}
nav.tabs .dot{width:52px;height:30px;border-radius:999px;display:grid;place-items:center}
nav.tabs svg{width:22px;height:22px}
nav.tabs .badge{position:absolute;top:6px;inset-inline-start:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--good);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* full player */
.full{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,var(--c2,#E8EDFF) 0%,rgba(246,244,239,0) 62%),var(--bg);display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
body.full-open .full{display:flex;animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
body.full-open{overflow:hidden}
.full .hd{display:flex;justify-content:space-between;align-items:center;min-height:48px;max-width:520px;width:100%;margin:0 auto}
.full .hd button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.75)}
.full .hd svg{width:24px;height:24px}
.full .hd span{font-size:.82rem;font-weight:600;color:var(--muted)}
.full .body{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;min-height:0;overflow-y:auto}
.full .art{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0;min-height:0}
.full .art .cover{width:min(78vw,340px,40vh);border-radius:28px;padding:22px;box-shadow:0 26px 60px rgba(27,27,34,.24);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.full .art .cover .nm{font-size:1.45rem}
body:not(.playing) .full .art .cover{transform:scale(.92)}
.full h3{margin:0;font-size:1.28rem;line-height:1.3;font-weight:700;text-align:start}
.full .crs{color:var(--muted);text-align:start;margin-top:2px;font-weight:500}
.full .span{display:inline-block;margin-top:8px;font-size:.82rem;font-weight:600;color:var(--accent);background:var(--accent-2);padding:4px 10px;border-radius:999px}
.full .span:empty{display:none}
.seek{margin-top:18px;position:relative;direction:ltr}
.seek input{width:100%;height:28px;margin:0;-webkit-appearance:none;appearance:none;background:transparent}
.seek input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--sv,0%),#D9D5CB var(--sv,0%))}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6px;box-shadow:0 2px 6px rgba(47,91,255,.4)}
.seek input::-moz-range-track{height:6px;border-radius:3px;background:#D9D5CB}
.seek input::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.seek input::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;direction:ltr}
.ctl button{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.ctl .big{width:78px;height:78px;background:var(--accent);color:#fff;box-shadow:0 14px 30px rgba(47,91,255,.38)}
.ctl .big svg{width:34px;height:34px}
.ctl svg{width:30px;height:30px}
.ctl .sp{font-weight:700;font-size:.95rem;background:var(--surface);box-shadow:var(--shadow);width:52px;height:52px}
.err{color:#B42318;font-size:.88rem;margin-top:12px;text-align:center;background:#FDECEA;border-radius:12px;padding:9px}
#toast{position:fixed;inset-inline:16px;bottom:calc(158px + env(safe-area-inset-bottom));background:var(--fg);color:#fff;padding:12px 16px;border-radius:14px;z-index:30;font-weight:500;text-align:center;box-shadow:var(--shadow-lg);max-width:560px;margin-inline:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><div class="hi" id="hi"></div><h1>הפודקאסטים שלי</h1></div><span class="off">אין אינטרנט · מתנגנים רק פרקים שהורדו</span></div>
  <div class="search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="חיפוש: קורס, נושא, מושג" aria-label="חיפוש פרקים" autocomplete="off" enterkeyhint="search">

    if(!eps.length){main.append(el('p',{class:'empty'},el('b',{},'עוד לא הורדת פרקים'),'לוחצים על סמל ההורדה ליד פרק, או "הורדת כל הקורס" בעמוד של קורס. פרק שהורד מתנגן גם בלי אינטרנט.'));return}
    main.append(el('p',{class:'muted',style:'margin:-4px 0 12px'},(eps.length===1?'פרק אחד שמור בטלפון':eps.length+' פרקים שמורים בטלפון')+(mb?` · ${Math.round(mb)}MB`:'')+'. מתנגנים גם בלי אינטרנט.'),list(sortEps(eps)));return}
  // home
  const ts=S.get('ts',{});
  const cont=EP.filter(e=>(pos[e.id]||0)>20&&!done[e.id]).sort((a,b)=>(ts[b.id]||0)-(ts[a.id]||0));
  if(cont.length){const e=cont[0];main.append(el('button',{type:'button',class:'resume',onclick:()=>playEp(e,true)},cover(e.course,null),
    el('div',{class:'tx'},el('div',{class:'k'},'להמשיך מאיפה שעצרת'),el('b',{},e.title),el('div',{class:'s'},`${e.course} · נשארו ${Math.max(1,Math.round((e.minutes||0)-(pos[e.id]||0)/60))} דק'`)),
    el('span',{class:'go',html:I.play})))}
  const hint=installHint(); if(hint)main.append(hint);
  main.append(el('a',{class:'reqcard',href:REQ,target:'_blank',rel:'noopener'},el('span',{class:'ic',html:I.spark}),el('span',{class:'tx'},el('b',{},'סיכום לפי בחירה'),el('span',{},'בוחרים שיעורים או תאריכים שכבר למדת, ומקבלים פרק סיכום')),el('span',{class:'ar',html:I.back})));
  const totalHeard=EP.filter(e=>done[e.id]).length;
  if(!cont.length&&!totalHeard)main.append(el('div',{class:'stat'},el('div',{},el('b',{},EP.length),el('span',{},'פרקים מוכנים')),el('div',{},el('b',{},courses.length),el('span',{},'קורסים')),el('div',{},el('b',{},Math.round(EP.reduce((a,e)=>a+(e.minutes||0),0)/60)),el('span',{},'שעות האזנה'))));
  const quiz=EP.filter(e=>e.kind==='quiz');
  if(quiz.length)main.append(el('h2',{},'לקראת הבחנים'),list(sortEps(quiz)));
  main.append(el('h2',{},el('span',{},'הקורסים שלך'),el('button',{type:'button',class:'lnk',onclick:()=>{view='courses';courseOpen=null;render();scrollTo(0,0)}},'לכל הקורסים')),
    el('div',{class:'row-scroll'},courses.map(c=>tile(c,()=>{view='courses';courseOpen=c;render();scrollTo(0,0)}))));
  const recent=EP.filter(e=>e.kind==='lesson').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,8);
  main.append(el('h2',{},'השיעורים האחרונים'),list(recent));
}

async function srcFor(e){
  if(saved.has(e.id)){try{const r=await caches.match(new URL(e.src,location.href).href);if(r){if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(await r.blob());return blobUrl}}catch(err){}}
  return e.src+'?v='+e.v;
}
async function playEp(e,openFull){
  if(cur&&cur.id===e.id){audio.paused?audio.play().catch(showErr):audio.pause();if(openFull)setFull(true);return}
  cur=e; S.set('last',e.id); document.body.classList.add('has-cur'); $('#err').hidden=true;
  audio.src=await srcFor(e); audio.playbackRate=S.get('rate',1);
  const start=done[e.id]?0:(pos[e.id]||0);
  audio.addEventListener('loadedmetadata',()=>{if(start&&start<audio.duration-5)audio.currentTime=start},{once:true});
  audio.play().catch(showErr);
  setupSession(e); paintPlayer(); render(); if(openFull)setFull(true);
}
function showErr(err){if(err&&err.name==='AbortError')return;$('#err').hidden=false;$('#err').textContent=navigator.onLine?'הניגון לא הצליח. לחץ שוב על ניגון.':'אין אינטרנט, והפרק הזה עוד לא הורד לטלפון.'}
function paintPlayer(){
  if(!cur)return; const [a,b]=colorOf(cur.course), playing=!audio.paused;
  document.body.classList.toggle('playing',playing);
  $('#miniCv').replaceChildren(cover(cur.course,null,true)); $('#miniT').textContent=cur.title; $('#miniC').textContent=cur.course;
  $('#miniPP').innerHTML=playing?I.pause:I.play; $('#miniPP').setAttribute('aria-label',playing?'השהיה':'ניגון');
  $('#fullPP').innerHTML=playing?I.pause:I.play; $('#fullPP').setAttribute('aria-label',playing?'השהיה':'ניגון');
  $('#fullT').textContent=cur.title; $('#fullC').textContent=cur.course; $('#fullKind').textContent=KIND[cur.kind]; $('#fullSpan').textContent=cur.span||(cur.date?fmtD(cur.date):'');
  $('#fullCv').replaceChildren(cover(cur.course,KIND[cur.kind])); $('#full').style.setProperty('--c2',b+'55');
  $('#fullDl').innerHTML=saved.has(cur.id)?I.done:I.dl; $('#fullDl').style.color=saved.has(cur.id)?'var(--good)':'';
  $('#fullDl').setAttribute('aria-label',saved.has(cur.id)?'שמור בטלפון':'הורדה לטלפון');
  const its=cur.items||[], tp=$('#topics'); tp.hidden=!its.length;
  if(its.length&&tp.dataset.id!==cur.id){tp.dataset.id=cur.id;tp.open=false;
    $('#topicsSum').replaceChildren(el('span',{},`מה בפרק (${its.length} נושאים)`),cur.verified?el('span',{class:'ver'},'כיסוי מאומת'):cur.missing?el('span',{class:'mis'},`חסרים ${cur.missing} פרטים`):el('span',{class:'unv'},'לפי מתווה השיעור'));
    $('#topicsList').replaceChildren(...its.map(t=>t.startsWith('✗ ')?el('li',{class:'miss'},t.slice(2)+' (חסר בפרק, ייכנס לפרק ההשלמה)'):el('li',{},t)));
    (cur.errors||[]).forEach(er=>$('#topicsList').append(el('li',{class:'miss'},'תיקון: '+er)));}
}
function setFull(o){document.body.classList.toggle('full-open',o);if(o)$('#closeFull').focus()}
function setupSession(e){if(!('mediaSession' in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:e.title,artist:e.course,album:'הפודקאסטים שלי',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  const ms=navigator.mediaSession; ms.setActionHandler('play',()=>audio.play()); ms.setActionHandler('pause',()=>audio.pause());
  ms.setActionHandler('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-15)); ms.setActionHandler('seekforward',()=>audio.currentTime+=30);
  try{ms.setActionHandler('seekto',d=>{audio.currentTime=d.seekTime})}catch(x){} try{ms.setActionHandler('nexttrack',playNext)}catch(x){}}
function playNext(){if(!cur)return;const l=sortEps(EP.filter(e=>e.course===cur.course));const i=l.findIndex(e=>e.id===cur.id);if(l[i+1])playEp(l[i+1]);else paintPlayer()}

async function download(e){
  if(dling[e.id]!=null||saved.has(e.id))return; dling[e.id]=0; updateRow(e);
  try{
    const url=new URL(e.src,location.href).href; const r=await fetch(e.src+'?v='+e.v,{cache:'no-store'}); if(!r.ok)throw new Error(r.status);
    const total=+r.headers.get('content-length')||e.size||0; const reader=r.body.getReader(); const chunks=[]; let got=0, last=0;
    for(;;){const {done:d,value}=await reader.read(); if(d)break; chunks.push(value); got+=value.length; const p=total?Math.min(99,Math.floor(got/total*100)):0; if(p-last>=3){last=p;dling[e.id]=p;updateRow(e)}}
    const blob=new Blob(chunks,{type:'audio/mp4'}); const c=await caches.open('pods');
    await c.put(url,new Response(blob,{headers:{'Content-Type':'audio/mp4','Content-Length':String(blob.size)}}));
    saved.add(e.id); if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(err){toast('ההורדה לא הושלמה. בדוק שיש אינטרנט ונסה שוב.')}
  delete dling[e.id]; if(Object.keys(dling).length)updateRow(e); else render(); paintPlayer();
}
async function removeDl(e){try{const c=await caches.open('pods');await c.delete(new URL(e.src,location.href).href);saved.delete(e.id)}catch(err){}render();paintPlayer();toast('הפרק הוסר מהטלפון')}
function updateRow(e){const old=document.getElementById('ep-'+e.id);if(old)old.replaceWith(epRow(e,old.dataset.mode,+old.dataset.i));else render()}
let tt; function toast(m){clearTimeout(tt);let t=$('#toast');if(!t){t=el('div',{id:'toast',role:'status'});document.body.append(t)}t.textContent=m;t.hidden=false;tt=setTimeout(()=>t.hidden=true,3200)}

let seeking=false; const sk=$('#seek');
const paintSeek=()=>sk.style.setProperty('--sv',(sk.value/10)+'%');
audio.addEventListener('timeupdate',()=>{if(!cur)return;const t=audio.currentTime,d=audio.duration||0;
  if(Math.floor(t)%5===0){pos[cur.id]=Math.floor(t);S.set('pos',pos);const ts=S.get('ts',{});ts[cur.id]=Date.now();S.set('ts',ts)}
  if(d&&t/d>0.95&&!done[cur.id]){done[cur.id]=true;S.set('done',done)}
  $('#miniBar').style.width=(d?t/d*100:0)+'%'; if(!seeking){sk.value=d?Math.round(t/d*1000):0;paintSeek()} $('#tCur').textContent=fmtT(t); $('#tDur').textContent='-'+fmtT(Math.max(0,d-t));
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&d){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(t,d),playbackRate:audio.playbackRate})}catch(x){}}});
audio.addEventListener('play',()=>{paintPlayer();updateCur()}); audio.addEventListener('pause',()=>{paintPlayer();updateCur();if(cur){pos[cur.id]=Math.floor(audio.currentTime);S.set('pos',pos)}});
audio.addEventListener('ended',()=>{if(cur){done[cur.id]=true;S.set('done',done)}playNext()});
audio.addEventListener('error',()=>showErr());
function updateCur(){if(cur)updateRow(cur)}
sk.addEventListener('input',()=>{seeking=true;paintSeek();$('#tCur').textContent=fmtT(sk.value/1000*(audio.duration||0))}); sk.addEventListener('change',()=>{audio.currentTime=sk.value/1000*(audio.duration||0);seeking=false});
$('#miniPP').onclick=()=>cur&&playEp(cur); $('#fullPP').onclick=()=>cur&&playEp(cur);
$('#miniB15').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);
$('#openFull').onclick=()=>setFull(true); $('#closeFull').onclick=()=>setFull(false);
$('#b15').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15); $('#f30').onclick=()=>audio.currentTime+=30; $('#next').onclick=playNext;
$('#fullDl').onclick=()=>cur&&(saved.has(cur.id)?removeDl(cur):download(cur));
const RATES=[1,1.25,1.5,1.75,2,0.8]; $('#speed').textContent=S.get('rate',1)+'x';
$('#speed').onclick=()=>{const r=RATES[(RATES.indexOf(S.get('rate',1))+1)%RATES.length];S.set('rate',r);audio.playbackRate=r;$('#speed').textContent=r+'x'};
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;courseOpen=null;$('#q').value='';render();scrollTo(0,0)});
$('#q').addEventListener('input',render); $('#clr').onclick=()=>{$('#q').value='';render();$('#q').focus()};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')setFull(false)});
let ty=null; $('#full').addEventListener('touchstart',ev=>{ty=ev.touches[0].clientY},{passive:true}); $('#full').addEventListener('touchend',ev=>{if(ty!=null&&ev.changedTouches[0].clientY-ty>110&&!ev.target.closest('.seek'))setFull(false);ty=null});
const setOnline=()=>document.body.classList.toggle('offline',!navigator.onLine); addEventListener('online',setOnline); addEventListener('offline',setOnline); setOnline();
let deferredPrompt=null; addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();deferredPrompt=ev;if(view==='home')render()});
function goHash(){const id=decodeURIComponent(location.hash.slice(1));const e=byId[id];if(!e)return;view='courses';courseOpen=e.course;render();const r=document.getElementById('ep-'+id);if(r){r.scrollIntoView({block:'center'});r.querySelector('.tx').focus()}}
addEventListener('hashchange',goHash);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
loadSaved().then(()=>{render();goHash();const last=byId[S.get('last')];if(last&&!cur){cur=last;document.body.classList.add('has-cur');srcFor(last).then(s=>{audio.src=s;audio.addEventListener('loadedmetadata',()=>{const p=pos[last.id];if(p)audio.currentTime=p},{once:true})});setupSession(last);paintPlayer()}});
</script>
