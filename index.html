<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="פודקאסטים">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>הפודקאסטים שלי</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Mobile-first audio app: header + search, content views, sticky mini-player above a bottom tab bar, full-screen player sheet. */
:root{--bg:#0E1424;--bg-2:#141C30;--card:#1A2440;--card-2:#222E50;--fg:#F1F5FF;--muted:#A3AEC8;--line:#2A3658;--accent:#3DD6A3;--accent-fg:#06281C;--warn:#FFC266;
  --font:"Heebo","Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font)}
body{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),rgba(14,20,36,.96));padding-top:env(safe-area-inset-top);backdrop-filter:blur(8px)}
header .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.off{font-size:.8rem;color:var(--warn);display:none}
body.offline .off{display:inline}
.search{position:relative}
.search input{width:100%;min-height:46px;border-radius:999px;border:0;background:var(--card);color:var(--fg);font:inherit;padding:0 44px 0 16px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
main{padding-block:8px 24px}
h2{font-size:1.15rem;font-weight:700;margin:22px 0 10px}
.muted{color:var(--muted)}
.row-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.tile{flex:none;width:150px;scroll-snap-align:start;text-align:start}
.cover{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:flex-end;padding:10px;font-weight:800;font-size:1rem;line-height:1.2;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cover small{position:absolute;top:8px;inset-inline-start:10px;font-weight:600;font-size:.72rem;opacity:.85}
.tile b{display:block;font-size:.9rem;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile span{font-size:.78rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grid .tile{width:auto}
.ep{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ep .pl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.ep.on .pl{background:var(--accent);color:var(--accent-fg)}
.ep svg{width:20px;height:20px}
.ep .tx{flex:1;min-width:0;text-align:start}
.ep .tx b{display:block;font-weight:600;font-size:.95rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep.on .tx b{color:var(--accent)}
.ep .meta{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--card-2);color:var(--muted)}
.tag.quiz{background:rgba(255,194,102,.15);color:var(--warn)}
.prog{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.dl{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative}
.dl.done{color:var(--accent)}
.dl .ring{position:absolute;inset:6px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),var(--line) 0)}
.dl .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
.dl .ring+svg{position:relative}
.back{display:flex;align-items:center;gap:8px;color:var(--muted);min-height:44px}
.chead{display:flex;gap:16px;align-items:flex-end;margin:6px 0 10px}
.chead .cover{width:120px;flex:none}
.chead h2{margin:0 0 4px}
.chead .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 16px;border-radius:999px;background:var(--card-2);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.pill.primary{background:var(--accent);color:var(--accent-fg)}
.pill svg{width:18px;height:18px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
/* mini player */
.mini{position:fixed;inset-inline:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:8;background:var(--card-2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;overflow:hidden}
body.has-cur .mini{display:block}
.mini .in{display:flex;align-items:center;gap:10px;padding:8px 10px}
.mini .cv{width:40px;height:40px;border-radius:6px;flex:none}
.mini .tx{flex:1;min-width:0;text-align:start}
.mini .tx b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tx span{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mini .pp{width:44px;height:44px;display:grid;place-items:center}
.mini .pp svg{width:26px;height:26px}
.mini .bar{height:2px;background:var(--line)}
.mini .bar i{display:block;height:100%;background:var(--fg);width:0}
/* bottom nav */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:7;background:rgba(14,20,36,.98);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;justify-content:space-around}
nav.tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;color:var(--muted)}
nav.tabs button[aria-current=page]{color:var(--fg)}
nav.tabs svg{width:24px;height:24px}
/* full player */
.full{position:fixed;inset:0;z-index:20;background:linear-gradient(var(--c1,#1A2440),var(--bg) 70%);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
body.full-open .full{display:flex}
body.full-open{overflow:hidden}
.full .hd{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.full .hd button{width:44px;height:44px;display:grid;place-items:center}
.full .hd svg{width:28px;height:28px}
.full .art{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0}
.full .art .cover{width:min(78vw,340px);font-size:1.4rem;padding:18px}
.full h3{margin:0;font-size:1.25rem;font-weight:700;text-align:start}
.full .crs{color:var(--muted);text-align:start;margin-top:2px}
.seek{margin-top:16px}
.seek input{width:100%;accent-color:var(--fg);height:28px}
.times{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctl button{width:56px;height:56px;display:grid;place-items:center}
.ctl .big{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg)}
.ctl .big svg{width:34px;height:34px}
.ctl svg{width:30px;height:30px}
.ctl .sp{font-weight:700;font-size:.95rem;width:56px}
.extra{display:flex;justify-content:space-between;margin-top:18px;align-items:center}
.err{color:#FF8A8A;font-size:.85rem;margin-top:8px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <div class="top"><h1 id="ttl">הפודקאסטים שלי</h1><span class="off">מצב לא מקוון · רק פרקים שהורדו</span></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

</div></nav>

  <div class="seek"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="מיקום בפרק"><div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>

    <button type="button" id="f30" aria-label="30 שניות קדימה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/><text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="Heebo">30</text></svg></button>

  </div>
  <div class="err" id="err" hidden></div>
</div>

function cover(course,label){const [a,b]=colorOf(course);return el('div',{class:'cover',style:`background:linear-gradient(135deg,${a},${b})`},label?el('small',{},label):null,course)}
function sortEps(list){return list.slice().sort((a,b)=>(a.kind==='quiz'?0:1)-(b.kind==='quiz'?0:1)||String(a.date||'0').localeCompare(String(b.date||'0'))||String(a.lesson||'').localeCompare(String(b.lesson||''),'he',{numeric:true}))}
function progOf(e){const p=pos[e.id]||0, d=(e.minutes||1)*60;return done[e.id]?1:Math.min(1,p/d)}

async function loadSaved(){saved=new Set();try{const c=await caches.open('pods');for(const r of await c.keys()){const id=decodeURIComponent(new URL(r.url).pathname.split('/').pop()).replace(/\.m4a$/,'');saved.add(id)}}catch(e){}}

function epRow(e,showCourse){
  const on=cur&&cur.id===e.id, playing=on&&!audio.paused;
  const p=progOf(e);
  const meta=el('div',{class:'meta'},e.kind!=='lesson'?el('span',{class:'tag'+(e.kind==='quiz'?' quiz':'')},KIND[e.kind]):null,
    showCourse?el('span',{},e.course):null,[e.date?fmtD(e.date):null,e.minutes?e.minutes+" דק'":null].filter(Boolean).join(' · '),
    done[e.id]?el('span',{},'· הושמע'):null);
  const dlBtn=el('button',{type:'button',class:'dl'+(saved.has(e.id)?' done':''),'aria-label':saved.has(e.id)?'הורד לטלפון. לחיצה להסרה':'הורדה לטלפון',onclick:ev=>{ev.stopPropagation();saved.has(e.id)?removeDl(e):download(e)}});
  if(dling[e.id]!=null){dlBtn.append(el('span',{class:'ring',style:`--p:${dling[e.id]}%`}));dlBtn.setAttribute('aria-label',`מוריד ${dling[e.id]}%`)}
  else dlBtn.innerHTML=saved.has(e.id)?I.done:I.dl;
  return el('div',{class:'ep'+(on?' on':''),id:'ep-'+e.id},
    el('button',{type:'button',class:'pl','aria-label':(playing?'השהיה: ':'ניגון: ')+e.title,html:playing?I.pause:I.play,onclick:()=>playEp(e)}),
    el('button',{type:'button',class:'tx',onclick:()=>playEp(e,true)},el('b',{},e.title),meta,p>0.01&&!done[e.id]?el('div',{class:'prog'},el('i',{style:`width:${Math.round(p*100)}%`})):null),
    dlBtn);
}
function render(){
  const q=$('#q').value.trim().toLowerCase(), main=$('#main'); main.replaceChildren();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.dataset.v===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  if(q){const hits=EP.filter(e=>(e.title+' '+e.course+' '+(KIND[e.kind]||'')).toLowerCase().includes(q));
    main.append(el('h2',{},`תוצאות (${hits.length})`),hits.length?el('div',{},sortEps(hits).map(e=>epRow(e,true))):el('p',{class:'empty'},'לא נמצאו פרקים.'));return}
  if(view==='courses'&&courseOpen){
    const list=sortEps(EP.filter(e=>e.course===courseOpen));
    main.append(el('button',{type:'button',class:'back',html:I.back+'<span>כל הקורסים</span>',onclick:()=>{courseOpen=null;render()}}),
      el('div',{class:'chead'},cover(courseOpen),el('div',{},el('h2',{},courseOpen),el('div',{class:'muted'},`${list.length} פרקים · ${Math.round(list.reduce((a,e)=>a+(e.minutes||0),0)/60*10)/10} שעות`),
        el('div',{class:'actions'},el('button',{type:'button',class:'pill primary',html:I.play+'<span>ניגון</span>',onclick:()=>{const nx=list.find(e=>!done[e.id])||list[0];playEp(nx)}}),
          el('button',{type:'button',class:'pill',html:I.dl+'<span>הורדת הקורס</span>',onclick:()=>list.forEach(e=>{if(!saved.has(e.id))download(e)})})))),
      el('div',{},list.map(e=>epRow(e,false))));return}
  if(view==='courses'){main.append(el('h2',{},'קורסים'),el('div',{class:'grid'},courses.map(c=>{const n=EP.filter(e=>e.course===c).length;
    return el('button',{type:'button',class:'tile',onclick:()=>{courseOpen=c;render();scrollTo(0,0)}},cover(c),el('b',{},c),el('span',{},n+' פרקים'))})));return}
  if(view==='downloads'){const list=EP.filter(e=>saved.has(e.id));
    main.append(el('h2',{},'הורדות'),el('p',{class:'muted'},'פרקים שהורדו מתנגנים גם בלי אינטרנט.'));
    if(!list.length){main.append(el('p',{class:'empty'},'עוד לא הורדת פרקים. לחץ על סמל ההורדה ליד פרק, או על "הורדת הקורס" בעמוד של קורס.'));return}
    main.append(el('div',{},sortEps(list).map(e=>epRow(e,true))));return}
  // home
  const cont=EP.filter(e=>(pos[e.id]||0)>20&&!done[e.id]).sort((a,b)=>(S.get('ts',{})[b.id]||0)-(S.get('ts',{})[a.id]||0));
  if(cont.length)main.append(el('h2',{},'המשך האזנה'),el('div',{},cont.slice(0,4).map(e=>epRow(e,true))));
  const quiz=EP.filter(e=>e.kind==='quiz');
  if(quiz.length)main.append(el('h2',{},'לקראת בחנים'),el('div',{},sortEps(quiz).map(e=>epRow(e,true))));
  main.append(el('h2',{},'הקורסים שלך'),el('div',{class:'row-scroll'},courses.map(c=>el('button',{type:'button',class:'tile',onclick:()=>{view='courses';courseOpen=c;render();scrollTo(0,0)}},cover(c),el('b',{},c),el('span',{},EP.filter(e=>e.course===c).length+' פרקים')))));
  const recent=EP.filter(e=>e.kind==='lesson').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,8);
  main.append(el('h2',{},'השיעורים האחרונים'),el('div',{},recent.map(e=>epRow(e,true))));
}

async function srcFor(e){
  if(saved.has(e.id)){try{const r=await caches.match(new URL(e.src,location.href).href);if(r){if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(await r.blob());return blobUrl}}catch(err){}}
  return e.src+'?v='+e.v;
}
async function playEp(e,openFull){
  if(cur&&cur.id===e.id){audio.paused?audio.play().catch(showErr):audio.pause();if(openFull)setFull(true);return}
  cur=e; S.set('last',e.id); document.body.classList.add('has-cur'); $('#err').hidden=true;
  audio.src=await srcFor(e); audio.playbackRate=S.get('rate',1);
  const start=done[e.id]?0:(pos[e.id]||0);
  audio.addEventListener('loadedmetadata',()=>{if(start&&start<audio.duration-5)audio.currentTime=start},{once:true});
  audio.play().catch(showErr);
  setupSession(e); paintPlayer(); render(); if(openFull)setFull(true);
}
function showErr(err){if(err&&err.name==='AbortError')return;$('#err').hidden=false;$('#err').textContent=navigator.onLine?'הניגון לא הצליח. לחץ שוב על ניגון.':'אין אינטרנט, והפרק הזה עוד לא הורד לטלפון.'}
function paintPlayer(){
  if(!cur)return; const [a,b]=colorOf(cur.course), playing=!audio.paused;
  $('#miniCv').style.background=`linear-gradient(135deg,${a},${b})`; $('#miniT').textContent=cur.title; $('#miniC').textContent=cur.course;
  $('#miniPP').innerHTML=playing?I.pause:I.play; $('#miniPP').setAttribute('aria-label',playing?'השהיה':'ניגון');
  $('#fullPP').innerHTML=playing?I.pause:I.play; $('#fullPP').setAttribute('aria-label',playing?'השהיה':'ניגון');
  $('#fullT').textContent=cur.title; $('#fullC').textContent=cur.course; $('#fullKind').textContent=KIND[cur.kind]+(cur.date?' · '+fmtD(cur.date):'');
  const cv=$('#fullCv'); cv.replaceWith(Object.assign(cover(cur.course,KIND[cur.kind]),{id:'fullCv'})); $('#full').style.setProperty('--c1',a);
  $('#fullDl').innerHTML=saved.has(cur.id)?I.done:I.dl; $('#fullDl').style.color=saved.has(cur.id)?'var(--accent)':'';
}
function setFull(o){document.body.classList.toggle('full-open',o);if(o)$('#closeFull').focus()}
function setupSession(e){if(!('mediaSession' in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:e.title,artist:e.course,album:'הלימודים שלי',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  const ms=navigator.mediaSession; ms.setActionHandler('play',()=>audio.play()); ms.setActionHandler('pause',()=>audio.pause());
  ms.setActionHandler('seekbackward',()=>audio.currentTime-=15); ms.setActionHandler('seekforward',()=>audio.currentTime+=30);
  try{ms.setActionHandler('seekto',d=>{audio.currentTime=d.seekTime})}catch(x){} try{ms.setActionHandler('nexttrack',playNext)}catch(x){}}
function playNext(){if(!cur)return;const list=sortEps(EP.filter(e=>e.course===cur.course));const i=list.findIndex(e=>e.id===cur.id);if(list[i+1])playEp(list[i+1])}

async function download(e){
  if(dling[e.id]!=null||saved.has(e.id))return; dling[e.id]=0; render();
  try{
    const url=new URL(e.src,location.href).href; const r=await fetch(e.src+'?v='+e.v,{cache:'no-store'}); if(!r.ok)throw new Error(r.status);
    const total=+r.headers.get('content-length')||e.size||0; const reader=r.body.getReader(); const chunks=[]; let got=0, last=0;
    for(;;){const {done:d,value}=await reader.read(); if(d)break; chunks.push(value); got+=value.length; const p=total?Math.min(99,Math.floor(got/total*100)):0; if(p-last>=4){last=p;dling[e.id]=p;updateRow(e)}}
    const blob=new Blob(chunks,{type:'audio/mp4'}); const c=await caches.open('pods');
    await c.put(url,new Response(blob,{headers:{'Content-Type':'audio/mp4','Content-Length':String(blob.size)}}));
    saved.add(e.id); if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(err){toast('ההורדה לא הושלמה. בדוק שיש אינטרנט ונסה שוב.')}
  delete dling[e.id]; render(); paintPlayer();
}
async function removeDl(e){try{const c=await caches.open('pods');await c.delete(new URL(e.src,location.href).href);saved.delete(e.id)}catch(err){}render();paintPlayer()}
function updateRow(e){const old=document.getElementById('ep-'+e.id);if(old)old.replaceWith(epRow(e,!!old.querySelector('.meta span:not(.tag)')))}
let tt; function toast(m){clearTimeout(tt);let t=$('#toast');if(!t){t=el('div',{id:'toast',role:'status',style:'position:fixed;inset-inline:16px;bottom:calc(140px + env(safe-area-inset-bottom));background:#fff;color:#111;padding:12px 14px;border-radius:10px;z-index:30;font-weight:500;text-align:center'});document.body.append(t)}t.textContent=m;t.hidden=false;tt=setTimeout(()=>t.hidden=true,3500)}

audio.addEventListener('timeupdate',()=>{if(!cur)return;const t=audio.currentTime,d=audio.duration||0;
  if(Math.floor(t)%5===0){pos[cur.id]=Math.floor(t);S.set('pos',pos);const ts=S.get('ts',{});ts[cur.id]=Date.now();S.set('ts',ts)}
  if(d&&t/d>0.95&&!done[cur.id]){done[cur.id]=true;S.set('done',done)}
  $('#miniBar').style.width=(d?t/d*100:0)+'%'; if(!seeking){$('#seek').value=d?Math.round(t/d*1000):0} $('#tCur').textContent=fmtT(t); $('#tDur').textContent=fmtT(d);
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&d){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(t,d),playbackRate:audio.playbackRate})}catch(x){}}});
audio.addEventListener('play',()=>{paintPlayer();updateCur()}); audio.addEventListener('pause',()=>{paintPlayer();updateCur();if(cur){pos[cur.id]=Math.floor(audio.currentTime);S.set('pos',pos)}});
audio.addEventListener('ended',()=>{if(cur){done[cur.id]=true;S.set('done',done)}playNext()});
audio.addEventListener('error',()=>showErr());
function updateCur(){if(cur)updateRow(cur)}
let seeking=false; const sk=$('#seek'); sk.addEventListener('input',()=>{seeking=true;$('#tCur').textContent=fmtT(sk.value/1000*(audio.duration||0))}); sk.addEventListener('change',()=>{audio.currentTime=sk.value/1000*(audio.duration||0);seeking=false});
$('#miniPP').onclick=()=>cur&&playEp(cur); $('#fullPP').onclick=()=>cur&&playEp(cur);
$('#openFull').onclick=()=>setFull(true); $('#closeFull').onclick=()=>setFull(false);
$('#b15').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15); $('#f30').onclick=()=>audio.currentTime+=30; $('#next').onclick=playNext;
$('#fullDl').onclick=()=>cur&&(saved.has(cur.id)?removeDl(cur):download(cur));
const RATES=[1,1.25,1.5,1.75,2,0.8]; $('#speed').textContent=S.get('rate',1)+'x';
$('#speed').onclick=()=>{const r=RATES[(RATES.indexOf(S.get('rate',1))+1)%RATES.length];S.set('rate',r);audio.playbackRate=r;$('#speed').textContent=r+'x'};
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;courseOpen=null;$('#q').value='';render();scrollTo(0,0)});
$('#q').addEventListener('input',render);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')setFull(false)});
const setOnline=()=>document.body.classList.toggle('offline',!navigator.onLine); addEventListener('online',setOnline); addEventListener('offline',setOnline); setOnline();
function goHash(){const id=decodeURIComponent(location.hash.slice(1));const e=byId[id];if(!e)return;view='courses';courseOpen=e.course;render();const r=document.getElementById('ep-'+id);if(r){r.scrollIntoView({block:'center'});r.querySelector('.pl').focus()}}
addEventListener('hashchange',goHash);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
loadSaved().then(()=>{render();goHash();const last=byId[S.get('last')];if(last&&!cur){cur=last;document.body.classList.add('has-cur');srcFor(last).then(s=>{audio.src=s;audio.addEventListener('loadedmetadata',()=>{const p=pos[last.id];if(p)audio.currentTime=p},{once:true})});setupSession(last);paintPlayer()}});
</script>
</body>
